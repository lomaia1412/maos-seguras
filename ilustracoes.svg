<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <!-- Mão aberta, palma para o observador, dedos para cima. Cores via CSS: --f (preenchimento), --s (contorno) -->
  <symbol id="mao" viewBox="0 0 64 100">
    <g fill="none" stroke-linecap="round">
      <line x1="16" y1="78" x2="5" y2="52" stroke="var(--s,#0b4f4c)" stroke-width="12"/>
      <line x1="16" y1="78" x2="5" y2="52" stroke="var(--f,#c9ece8)" stroke-width="7"/>
      <line x1="18" y1="52" x2="18" y2="20" stroke="var(--s,#0b4f4c)" stroke-width="12"/>
      <line x1="18" y1="52" x2="18" y2="20" stroke="var(--f,#c9ece8)" stroke-width="7"/>
      <line x1="28" y1="50" x2="28" y2="11" stroke="var(--s,#0b4f4c)" stroke-width="12"/>
      <line x1="28" y1="50" x2="28" y2="11" stroke="var(--f,#c9ece8)" stroke-width="7"/>
      <line x1="38" y1="50" x2="38" y2="14" stroke="var(--s,#0b4f4c)" stroke-width="12"/>
      <line x1="38" y1="50" x2="38" y2="14" stroke="var(--f,#c9ece8)" stroke-width="7"/>
      <line x1="48" y1="54" x2="48" y2="26" stroke="var(--s,#0b4f4c)" stroke-width="12"/>
      <line x1="48" y1="54" x2="48" y2="26" stroke="var(--f,#c9ece8)" stroke-width="7"/>
    </g>
    <path d="M12 46h42v26c0 11-8 19-19 19h-4c-11 0-19-8-19-19z" fill="var(--f,#c9ece8)" stroke="var(--s,#0b4f4c)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M22 89v10h22V89" fill="var(--f,#c9ece8)" stroke="var(--s,#0b4f4c)" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>
  <!-- Mão vista pelo dorso: mesma forma + unhas -->
  <symbol id="dorso" viewBox="0 0 64 100">
    <use href="#mao" xlink:href="#mao" width="64" height="100"/>
    <g fill="var(--u,#ffffff)" stroke="var(--s,#0b4f4c)" stroke-width="1.2">
      <rect x="15.5" y="17" width="5" height="6" rx="2"/>
      <rect x="25.5" y="8" width="5" height="6" rx="2"/>
      <rect x="35.5" y="11" width="5" height="6" rx="2"/>
      <rect x="45.5" y="23" width="5" height="6" rx="2"/>
    </g>
  </symbol>
  <!-- Mão com dedos dobrados (punho semiaberto), dedos para cima -->
  <symbol id="punho" viewBox="0 0 64 100">
    <g fill="none" stroke-linecap="round">
      <line x1="16" y1="78" x2="6" y2="56" stroke="var(--s,#0b4f4c)" stroke-width="12"/>
      <line x1="16" y1="78" x2="6" y2="56" stroke="var(--f,#c9ece8)" stroke-width="7"/>
    </g>
    <path d="M12 52h42v20c0 11-8 19-19 19h-4c-11 0-19-8-19-19z" fill="var(--f,#c9ece8)" stroke="var(--s,#0b4f4c)" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="var(--f,#c9ece8)" stroke="var(--s,#0b4f4c)" stroke-width="2.5">
      <rect x="12" y="38" width="11" height="18" rx="5.5"/>
      <rect x="22.5" y="35" width="11" height="20" rx="5.5"/>
      <rect x="33" y="36" width="11" height="19" rx="5.5"/>
      <rect x="43.5" y="40" width="10.5" height="16" rx="5.25"/>
    </g>
    <path d="M22 89v10h22V89" fill="var(--f,#c9ece8)" stroke="var(--s,#0b4f4c)" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>

  <!-- 1. Palma contra palma -->
  <symbol id="mov1" viewBox="0 0 120 120">
    <g transform="translate(70 54) rotate(-8) translate(-29 -46)" style="--f:#7cc7bf"><g transform="translate(58 0) scale(-1 1)"><use href="#mao" xlink:href="#mao" width="58" height="92"/></g></g>
    <g transform="translate(50 54) rotate(8) translate(-29 -46)"><use href="#mao" xlink:href="#mao" width="58" height="92"/></g>
    <g fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 110h60M38 103l-8 7 8 7M82 103l8 7-8 7"/>
    </g>
  </symbol>
  <!-- 2. Palma sobre o dorso, dedos entrelaçados -->
  <symbol id="mov2" viewBox="0 0 120 120">
    <g transform="translate(46 86) rotate(90) translate(-27 -43)" style="--f:#7cc7bf"><use href="#dorso" xlink:href="#dorso" width="54" height="86"/></g>
    <g transform="translate(66 66) rotate(104) translate(-27 -43)"><g transform="translate(54 0) scale(-1 1)"><use href="#mao" xlink:href="#mao" width="54" height="86"/></g></g>
    <g fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 14h54M38 7l-8 7 8 7M76 7l8 7-8 7"/>
    </g>
  </symbol>
  <!-- 3. Palma contra palma, dedos entrelaçados -->
  <symbol id="mov3" viewBox="0 0 120 120">
    <g transform="translate(57 50) translate(-29 -46)" style="--f:#7cc7bf"><use href="#mao" xlink:href="#mao" width="58" height="92"/></g>
    <g transform="translate(52 64) translate(-29 -46)"><g transform="translate(58 0) scale(-1 1)"><use href="#mao" xlink:href="#mao" width="58" height="92"/></g></g>
    <g fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M104 34v56M97 42l7-8 7 8M97 82l7 8 7-8"/>
    </g>
  </symbol>
  <!-- 4. Dorso dos dedos contra a palma oposta -->
  <symbol id="mov4" viewBox="0 0 120 120">
    <g transform="translate(63 54) rotate(180) translate(-26 -41)" style="--f:#7cc7bf"><use href="#punho" xlink:href="#punho" width="52" height="82"/></g>
    <g transform="translate(57 72) translate(-26 -41)"><use href="#punho" xlink:href="#punho" width="52" height="82"/></g>
    <g fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 62h20M12 55l-6 7 6 7M20 55l6 7-6 7M94 62h20M100 55l-6 7 6 7M108 55l6 7-6 7"/>
    </g>
  </symbol>
  <!-- 5. Polegar com a palma oposta, movimento circular -->
  <symbol id="mov5" viewBox="0 0 120 120">
    <g style="--f:#7cc7bf"><use href="#mao" xlink:href="#mao" x="46" y="18" width="62" height="98"/></g>
    <g fill="#c9ece8" stroke="#0b4f4c" stroke-width="2.5">
      <ellipse cx="44" cy="60" rx="20" ry="24"/>
      <path d="M30 46q14 6 28 0M28 58q16 6 32 0M30 70q14 6 28 0" fill="none" stroke-width="2"/>
    </g>
    <g fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 34a30 30 0 1 0 26-8"/>
      <path d="M36 19l9 7-8 8"/>
    </g>
  </symbol>
  <!-- 6. Polpas digitais e unhas na palma, movimento circular -->
  <symbol id="mov6" viewBox="0 0 120 120">
    <g style="--f:#7cc7bf"><use href="#mao" xlink:href="#mao" x="26" y="20" width="62" height="98"/></g>
    <g fill="none" stroke-linecap="round">
      <line x1="40" y1="8" x2="54" y2="72" stroke="#0b4f4c" stroke-width="12"/><line x1="40" y1="8" x2="54" y2="72" stroke="#c9ece8" stroke-width="7"/>
      <line x1="56" y1="4" x2="57" y2="72" stroke="#0b4f4c" stroke-width="12"/><line x1="56" y1="4" x2="57" y2="72" stroke="#c9ece8" stroke-width="7"/>
      <line x1="72" y1="6" x2="60" y2="72" stroke="#0b4f4c" stroke-width="12"/><line x1="72" y1="6" x2="60" y2="72" stroke="#c9ece8" stroke-width="7"/>
    </g>
    <g fill="#fff" stroke="#0b4f4c" stroke-width="1.2">
      <rect x="51" y="65" width="5" height="6" rx="2"/><rect x="55" y="66" width="5" height="6" rx="2"/><rect x="59" y="65" width="5" height="6" rx="2"/>
    </g>
    <g fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 70a30 16 0 1 1 -14 -12"/>
      <path d="M78 50l6 9-10 4"/>
    </g>
  </symbol>
</svg>
